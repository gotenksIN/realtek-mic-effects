# Drop-in PipeWire configuration for Realtek-style AEC + Noise Suppression.
# Install to: ~/.config/pipewire/pipewire.conf.d/60-realtek-mic-effects.conf
# Note: Requires libspa-aec-realtek.so in your SPA plugin directory under aec/.

context.modules = [
    {
        name = libpipewire-module-echo-cancel
        flags = [ ifexists nofail ]
        args = {
            library.name = aec/libspa-aec-realtek
            monitor.mode = true
            aec.args = {
                realtek.hpf = true
                realtek.hpf_hz = 100.0
                realtek.aec = true
                realtek.delay_est = true
                realtek.echo_tail_ms = 170.0
                realtek.ns = true
                realtek.ns_floor_db = -18.0
                realtek.echo_floor_db = -34.0
                realtek.gain_db = 0.0
            }
            capture.props = {
                node.passive = true
            }
            source.props = {
                node.name = "realtek_mic_effects_source"
                node.description = "Realtek Mic Effects (AEC + NS)"
            }
        }
    }
]
